[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moderag"
version = "0.1.0"
description = "ModeRAG: agentic RAG with vector and graph retrieval"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dawei Fu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10"

dependencies = [
    # LLM
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-huggingface>=0.0.1",
    "openai>=1.0.0",

    # Embedding & Reranker
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",

    # Vector Store
    "faiss-gpu-cu12>=1.14.0",
    "langchain-community>=0.2.0",

    # Graph
    "networkx>=3.0",

    # HTTP Client
    "httpx>=0.24.0",

    # Web Framework (for websearch proxy)
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",

    # Utilities
    "rank-bm25>=0.2.2",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

gpu = [
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/PKUfudawei/ModeRAG"
Repository = "https://github.com/PKUfudawei/ModeRAG"
Dataset = "https://huggingface.co/datasets/PKUfudawei/LHCpublications"

[tool.setuptools.packages.find]
where = ["."]
include = ["moderag*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
